name: Build and Publish

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
  merge_group:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_NAME: dsb-common

jobs:
  build_push:
    name: Dagger release pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Build image with Dagger
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch))
        uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "v0.20.8"
          verb: call
          args: >-
            build
            --registry ${{ env.IMAGE_REGISTRY }}
            --image-name ${{ env.IMAGE_NAME }}
            --sha ${{ github.sha }}

      - name: Detect signing key
        id: signing-key
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
        shell: bash
        run: |
          if [[ -n "${SIGNING_SECRET}" ]]; then
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          else
            echo "configured=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Release with Dagger and signing
        if: steps.signing-key.outputs.configured == 'true'
        uses: dagger/dagger-for-github@v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        with:
          version: "v0.20.8"
          verb: call
          args: >-
            release
            --registry ${{ env.IMAGE_REGISTRY }}
            --image-name ${{ env.IMAGE_NAME }}
            --registry-username ${{ github.actor }}
            --registry-password env:GITHUB_TOKEN
            --signing-key env:SIGNING_SECRET
            --signing-password env:SIGNING_PASSWORD
            --sha ${{ github.sha }}
            --ref-name ${{ github.ref_name }}
            --pipeline-url ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            --source-uri ${{ github.server_url }}/${{ github.repository }}

      - name: Release with Dagger without signing
        if: steps.signing-key.outputs.configured == 'false'
        uses: dagger/dagger-for-github@v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: "v0.20.8"
          verb: call
          args: >-
            release
            --registry ${{ env.IMAGE_REGISTRY }}
            --image-name ${{ env.IMAGE_NAME }}
            --registry-username ${{ github.actor }}
            --registry-password env:GITHUB_TOKEN
            --sha ${{ github.sha }}
            --ref-name ${{ github.ref_name }}
            --pipeline-url ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            --source-uri ${{ github.server_url }}/${{ github.repository }}
            --sign=false
            --attest=false

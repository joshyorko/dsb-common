name: Build and Publish

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
  merge_group:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_NAME: dsb-common

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup runner tools
        uses: projectbluefin/actions/bootc-build/setup-runner@bd1d83a3eb3a55d63f71069cd9234d6a8d93f4b5 # v1
        with:
          storage-backend: none
          install-tools: '["just"]'

      - name: Preflight publish
        id: preflight
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: projectbluefin/actions/bootc-build/preflight@bd1d83a3eb3a55d63f71069cd9234d6a8d93f4b5 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}

      - name: Generate tags
        id: generate-tags
        shell: bash
        run: |
          echo "sha_short=${GITHUB_SHA::7}" >> "${GITHUB_OUTPUT}"
          alias_tags=()
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            alias_tags+=("pr-${{ github.event.number }}")
          else
            echo "date=$(date +%Y%m%d)" >> "${GITHUB_OUTPUT}"
            alias_tags+=("latest")
          fi
          echo "alias_tags=${alias_tags[*]}" >> "${GITHUB_OUTPUT}"

      - name: Build Image
        id: build_image
        shell: bash
        run: |
          set -euo pipefail

          sudo -E "$(command -v just)" build-ghcr "${IMAGE_NAME}" latest

          echo "image=${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "tags=${STEPS_TAGS}" >> "${GITHUB_OUTPUT}"
        env:
          STEPS_TAGS: >-
            ${{ steps.generate-tags.outputs.alias_tags }}
            ${{ steps.generate-tags.outputs.date }}
            ${{ steps.generate-tags.outputs.sha_short }}

      - name: Push to GHCR
        id: push
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: projectbluefin/actions/bootc-build/push-image@bd1d83a3eb3a55d63f71069cd9234d6a8d93f4b5 # v1
        with:
          image-name: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.build_image.outputs.tags }}
          default-tag: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign and publish provenance
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: projectbluefin/actions/bootc-build/sign-and-publish@bd1d83a3eb3a55d63f71069cd9234d6a8d93f4b5 # v1
        with:
          image: ${{ steps.preflight.outputs.image-ref }}
          digest: ${{ steps.push.outputs.digest }}
          signing-mode: keyless
          generate-sbom: "true"
          push-attestation: "true"
          certificate-identity-regexp: '^https://github\.com/joshyorko/dsb-common/\.github/workflows/build\.yml@refs/heads/main$'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}

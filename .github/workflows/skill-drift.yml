name: Skill Drift

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  skill-drift:
    uses: projectbluefin/actions/.github/workflows/skill-drift-check.yml@b692a857860b9007e78243dea980b8ee6828f882 # v1
    with:
      code-paths: '["system_files/**", ".github/workflows/**", "Containerfile", "Justfile"]'
      skill-paths: '["AGENTS.md", "README.md", "docs/**", ".github/skills/**"]'

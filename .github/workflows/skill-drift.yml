name: Skill Drift

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  skill-drift:
    uses: projectbluefin/actions/.github/workflows/skill-drift-check.yml@3febbaafca01ca3fd1973eb71a7d07d0c2958090 # v1
    with:
      code-paths: '["system_files/**", ".github/workflows/**", "Containerfile", "Justfile"]'
      skill-paths: '["AGENTS.md", "README.md", "docs/**", ".github/skills/**"]'

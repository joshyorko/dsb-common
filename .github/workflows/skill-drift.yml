name: Skill Drift

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  skill-drift:
    uses: projectbluefin/actions/.github/workflows/skill-drift-check.yml@0642c0d2a58c8e7bf4f426d41ed76a33bbd9559f # v1
    with:
      code-paths: '["system_files/**", ".github/workflows/**", "Containerfile", "Justfile"]'
      skill-paths: '["AGENTS.md", "README.md", "docs/**", ".github/skills/**"]'

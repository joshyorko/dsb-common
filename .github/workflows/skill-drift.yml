name: Skill Drift

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  skill-drift:
    uses: projectbluefin/actions/.github/workflows/skill-drift-check.yml@d18642a8b4b325c2551eabd9a65c1ad12b4ebb30 # v1
    with:
      code-paths: '["system_files/**", ".github/workflows/**", "Containerfile", "Justfile"]'
      skill-paths: '["AGENTS.md", "README.md", "docs/**", ".github/skills/**"]'

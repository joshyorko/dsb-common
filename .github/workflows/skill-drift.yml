name: Skill Drift

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  skill-drift:
    uses: projectbluefin/actions/.github/workflows/skill-drift-check.yml@4fb323625b017f6731a9a54c29ec08314f4e9e66 # v1
    with:
      code-paths: '["system_files/**", ".github/workflows/**", "Containerfile", "Justfile"]'
      skill-paths: '["AGENTS.md", "README.md", "docs/**", ".github/skills/**"]'
